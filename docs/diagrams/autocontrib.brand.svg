<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400">
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8623C"/>
      <stop offset="1" stop-color="#F2A33C"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8623C"/>
      <stop offset="1" stop-color="#F2A33C"/>
    </linearGradient>
  </defs>
  <g transform="translate(60 0)">

  <!-- mark: two branches merging into upstream -->
  <g transform="translate(300 200)">
    <path d="M -96 -88 L -96 -20 Q -96 44 -28 44 L 44 44"
          fill="none" stroke="url(#mark)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -96 -8 L -96 20 Q -96 44 -60 44"
          fill="none" stroke="url(#mark)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
    <circle cx="-96" cy="-88" r="34" fill="none" stroke="url(#mark)" stroke-width="22"/>
    <circle cx="-96" cy="-88" r="12" fill="#F2A33C"/>
    <circle cx="96" cy="44" r="44" fill="none" stroke="url(#mark)" stroke-width="24"/>
    <path d="M 74 42 L 90 58 L 122 26" fill="none" stroke="#F2A33C" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <line x1="500" y1="110" x2="500" y2="290" stroke="#E8623C" stroke-opacity="0.4" stroke-width="4" stroke-linecap="round"/>

  <text x="560" y="222" font-family="'Helvetica Neue', 'SF Pro Display', Arial, sans-serif"
        font-weight="700" font-size="148" letter-spacing="-5" fill="#C74B28">auto<tspan fill="url(#word)">contrib</tspan></text>
  <text x="566" y="292" font-family="'Helvetica Neue', 'SF Pro Display', Arial, sans-serif"
        font-weight="500" font-size="44" letter-spacing="1" fill="#D97E4E">Land PRs in projects that want them</text>
  </g>
</svg>
